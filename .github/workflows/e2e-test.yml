name: E2E – Live Game Test on Render

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      render_url:
        description: "Render URL (e.g. https://your-app.onrender.com)"
        required: false

env:
  BASE_URL: ${{ inputs.render_url || secrets.RENDER_URL || 'https://simplegreentechtransition.onrender.com' }}

jobs:
  e2e:
    name: Full game – create → join → play → finish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # Render free tier sleeps after inactivity – wake the backend API, not the static site
      - name: "Wake up backend (cold-start)"
        run: |
          echo "Pinging backend API until it responds..."
          for i in 1 2 3 4 5 6; do
            BODY=$(curl -s --max-time 40 -X POST "$BASE_URL/api/rooms" \
              -H "Content-Type: application/json" \
              -d '{"g_min":0.1,"g_max":0.9,"num_rounds":1,"alpha":0,"beta":0,"pi_p":4,"pi_r":3,"pi_q":5,"c_u":10,"c_o":1}')
            echo "  Attempt $i: $BODY"
            echo "$BODY" | grep -q "room_id" && { echo "  Backend is up."; break; }
            [ "$i" = "6" ] && { echo "FAIL: backend did not wake up"; exit 1; }
            sleep 10
          done

      # ── 1. Backend root responds ─────────────────────────────────────────────
      - name: "Check: backend responds (HTTP 200)"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/")
          echo "HTTP status: $STATUS"
          [ "$STATUS" = "200" ] || { echo "FAIL: expected 200, got $STATUS"; exit 1; }

      # ── 2. Full game via API ─────────────────────────────────────────────────
      - name: "Play a full game via API"
        env:
          BASE_URL: ${{ env.BASE_URL }}
        run: |
          python - <<'PYEOF'
          import os, sys, json, requests

          BASE = os.environ["BASE_URL"].rstrip("/")
          s    = requests.Session()
          s.headers["Content-Type"] = "application/json"

          def safe_json(r, label=""):
              """Parse JSON; print helpful debug info and exit on any failure."""
              text = r.text.strip() if r.text else ""
              if not r.ok:
                  print(f"FAIL [{label}] HTTP {r.status_code}", file=sys.stderr)
                  print(f"  Body: {text[:400]}", file=sys.stderr)
                  sys.exit(1)
              if not text:
                  print(f"FAIL [{label}] HTTP {r.status_code} – empty response body",
                        file=sys.stderr)
                  print(f"  Content-Type: {r.headers.get('Content-Type','?')}",
                        file=sys.stderr)
                  sys.exit(1)
              try:
                  return r.json()
              except Exception as e:
                  print(f"FAIL [{label}] JSON parse error: {e}", file=sys.stderr)
                  print(f"  HTTP {r.status_code}  Body: {text[:400]}", file=sys.stderr)
                  sys.exit(1)

          def ok(r, label=""):
              data = safe_json(r, label)
              print(f"  OK  [{label}] {json.dumps(data)[:200]}")
              return data

          def get_json(url, label="", **kwargs):
              r = s.get(url, **kwargs)
              return safe_json(r, label)

          # ── 1. Create room ──────────────────────────────────────────────────
          print("=== 1. Create room ===")
          d = ok(s.post(f"{BASE}/api/rooms", json={
              "g_min": 0.2, "g_max": 0.8, "num_rounds": 3,
              "alpha": 0.0, "beta": 0.0,
              "pi_p": 4.0, "pi_r": 3.0, "pi_q": 5.0,
              "c_u": 10.0, "c_o": 1.0,
          }), "create_room")
          room_id     = d["room_id"]
          admin_token = d["admin_token"]
          print(f"  room_id={room_id}  admin_token={admin_token}")

          # ── 2. Join 2 players ───────────────────────────────────────────────
          print("=== 2. Join 2 players ===")
          p1   = ok(s.post(f"{BASE}/api/rooms/{room_id}/join",
                           json={"player_name": "Alice"}), "join Alice")
          p2   = ok(s.post(f"{BASE}/api/rooms/{room_id}/join",
                           json={"player_name": "Bob"}), "join Bob")
          pid1 = p1["player_id"]
          pid2 = p2["player_id"]

          # ── 3. Start game ───────────────────────────────────────────────────
          print("=== 3. Start game ===")
          ok(s.post(f"{BASE}/api/rooms/{room_id}/start",
                    json={"admin_token": admin_token}), "start")

          # ── 4. Verify playing state ─────────────────────────────────────────
          print("=== 4. Check state after start ===")
          state = get_json(f"{BASE}/api/rooms/{room_id}/state",
                           label="state-after-start",
                           params={"admin_token": admin_token})
          assert state["status"] == "playing", \
              f"Expected 'playing', got {state['status']}"
          num_rounds = state["num_rounds"]
          print(f"  num_rounds={num_rounds}")

          # ── 5. Play all rounds ──────────────────────────────────────────────
          for rnd in range(1, num_rounds + 1):
              print(f"\n=== Round {rnd}/{num_rounds} ===")

              state  = get_json(f"{BASE}/api/rooms/{room_id}/state",
                                label=f"r{rnd}-state",
                                params={"admin_token": admin_token})
              share1 = state["players"][pid1]["share"]
              share2 = state["players"][pid2]["share"]
              print(f"  Alice share={share1:.4f}  Bob share={share2:.4f}")

              ok(s.post(f"{BASE}/api/rooms/{room_id}/submit",
                        json={"player_id": pid1, "investment": round(share1 * 0.5, 4)}),
                 f"r{rnd}-submit-Alice")
              ok(s.post(f"{BASE}/api/rooms/{room_id}/submit",
                        json={"player_id": pid2, "investment": round(share2 * 1.0, 4)}),
                 f"r{rnd}-submit-Bob")

              ok(s.post(f"{BASE}/api/rooms/{room_id}/resolve",
                        json={"admin_token": admin_token}), f"r{rnd}-resolve")

              state = get_json(f"{BASE}/api/rooms/{room_id}/state",
                               label=f"r{rnd}-results",
                               params={"admin_token": admin_token})
              assert state["status"] == "round_results", \
                  f"Expected round_results, got {state['status']}"

              last = state["history"][-1]
              print(f"  A_g={last['A_g']:.4f}")
              for pid, r in last["results"].items():
                  print(f"    {r['name']}: score={r['score']:.3f}  s_new={r['s_new']:.4f}")

              ok(s.post(f"{BASE}/api/rooms/{room_id}/next_round",
                        json={"admin_token": admin_token}),
                 f"r{rnd}-next_round")

          # ── 6. Verify finished ──────────────────────────────────────────────
          print("\n=== 5. Verify final state ===")
          state = get_json(f"{BASE}/api/rooms/{room_id}/state",
                           label="final-state",
                           params={"admin_token": admin_token})
          assert state["status"] == "finished", \
              f"Expected 'finished', got {state['status']}"

          scores = {pid: p["total_score"] for pid, p in state["players"].items()}
          winner = max(scores, key=scores.get)
          print(f"  Winner: {state['players'][winner]['name']}  "
                f"({scores[winner]:.3f})")
          print("\n  PASS – game ran successfully on Render!")
          PYEOF

      # ── 3. Unknown room returns 404 ──────────────────────────────────────────
      - name: "Check: unknown room returns 404"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$BASE_URL/api/rooms/ZZZZZZ/state")
          echo "HTTP status for unknown room: $STATUS"
          [ "$STATUS" = "404" ] || { echo "FAIL: expected 404, got $STATUS"; exit 1; }
